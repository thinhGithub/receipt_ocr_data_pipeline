project:
  name: receipt_ocr_data_pipeline
  random_seed: 42

preprocessing:
  enabled: false
  variant: orientation_crop_resize
  resize_width: 1600
  resize_max_upscale: 4.0
  orientation_min_confidence: 5.0
  clahe_clip_limit: 2.0
  clahe_grid_size: 8
  crop_padding: 0.01
  min_receipt_area: 0.08
  min_crop_score: 0.38
  output_dir: data/interim/mc_ocr2021/preprocessed/orientation_crop_resize

ocr:
  engine: tesseract
  language: vie+eng
  page_segmentation_mode: 6
  confidence_threshold: 0.50
  cache:
    enabled: true
    directory: data/interim/mc_ocr2021/ocr_cache

extraction:
  methods:
    - regex
    - keyword
  fuzzy_matching: false
  fuzzy_threshold: 0.85
  fields:
    - seller
    - address
    - timestamp
    - total_cost

storage:
  enabled: false
  format: jsonl
  output_dir: data/processed
  save_intermediate_results: true
