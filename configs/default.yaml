project:
  name: receipt_ocr_data_pipeline
  random_seed: 42

preprocessing:
  enabled: false
  grayscale: true
  denoise: false
  deskew: false
  resize_max_width: 2000

ocr:
  engine: tesseract
  language: vie+eng
  page_segmentation_mode: 6
  confidence_threshold: 0.50
  cache:
    enabled: true
    directory: data/interim/mc_ocr2021/ocr_cache

extraction:
  methods:
    - regex
    - keyword
  fuzzy_matching: false
  fuzzy_threshold: 0.85
  fields:
    - seller
    - address
    - timestamp
    - total_cost

storage:
  enabled: false
  format: jsonl
  output_dir: data/processed
  save_intermediate_results: true
